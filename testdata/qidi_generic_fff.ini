# Configuration FFF générique — usage : gate de slicing et dépannage.
#
# Ce n'est PAS un profil QIDI : c'est un jeu de valeurs minimales et neutres qui
# permet au cœur de slicer et de produire un G-code valide. Pour imprimer, il faut
# un profil réel (exporté depuis QIDISlicer desktop, ou à terme installé depuis le
# bundle vendor QIDITechnology.ini embarqué dans l'app).
#
# Format : ini plat accepté par `--load`, comme PrusaSlicer/QIDISlicer.

## --- imprimante -------------------------------------------------------------
printer_technology = FFF
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
filament_diameter = 1.75
gcode_flavor = klipper
use_relative_e_distances = 1
use_firmware_retraction = 0
retract_length = 0.8
retract_speed = 35
retract_lift = 0.2
z_offset = 0
extruder_offset = 0x0
single_extruder_multi_material = 0
nozzle_volume = 115

## --- impression -------------------------------------------------------------
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
top_fill_pattern = monotonic
infill_overlap = 25%
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.42
solid_infill_extrusion_width = 0.45
first_layer_extrusion_width = 0.5
perimeter_speed = 60
external_perimeter_speed = 40
infill_speed = 100
solid_infill_speed = 80
travel_speed = 200
first_layer_speed = 30
support_material = 0
brim_width = 0

## --- filament ---------------------------------------------------------------
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
cooling = 1
min_fan_speed = 30
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1

## --- G-code de début/fin (minimal, sans macro Klipper) ----------------------
start_gcode = G90\nM83\nG28\nG1 Z5 F600\nM104 S[first_layer_temperature]\nM140 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nM190 S[first_layer_bed_temperature]\nG1 X5 Y5 Z0.3 F6000\nG92 E0
end_gcode = M104 S0\nM140 S0\nG91\nG1 E-2 F2700\nG1 Z1 F600\nG90\nG1 X5 Y200 F6000\nM84
