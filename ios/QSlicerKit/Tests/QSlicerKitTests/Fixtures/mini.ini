# Bundle vendor minimal reprenant la structure de QIDITechnology.ini
[vendor]
name = QIDI Technology
config_version = 1.2.5

[printer_model:Q2]
name = Q2
variants = 0.4; 0.6

[printer:*common*]
printer_technology = FFF
gcode_flavor = klipper
use_relative_e_distances = 1
nozzle_diameter = 0.4

[printer:*Q2*]
inherits = *common*
printer_model = Q2
bed_shape = 0x0,270x0,270x270,0x270

[printer:Q2 0.4 nozzle]
inherits = *Q2*
nozzle_diameter = 0.4

[printer:Q2 0.6 nozzle]
inherits = *Q2*
nozzle_diameter = 0.6

[print:*common*]
layer_height = 0.2
perimeters = 2
fill_density = 15%
brim_width = 0
raft_layers = 0
support_material = 0
support_material_auto = 1
support_material_buildplate_only = 0
output_filename_format = [input_filename_base].gcode

[print:*Q2_04*]
inherits = *common*
compatible_printers_condition = printer_model=="Q2" and nozzle_diameter[0]==0.4

[print:0.20mm Standard @Q2 0.4 nozzle]
inherits = *Q2_04*

[print:0.12mm Fine @Q2 0.4 nozzle]
inherits = *Q2_04*
layer_height = 0.12

[print:0.30mm Draft @Q2 0.6 nozzle]
inherits = *common*
layer_height = 0.3

[filament:*common*]
temperature = 210
first_layer_temperature = 215

[filament:QIDI ABS @Q2 0.4 nozzle]
inherits = *common*
temperature = 260,260
first_layer_temperature = 265,265

[filament:QIDI PLA @Q2 0.4 nozzle]
inherits = *common*
temperature = 215

[filament:QIDI PETG @Q2 0.6 nozzle]
inherits = *common*
temperature = 240
