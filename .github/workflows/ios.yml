name: ios

# Chaîne complète, sur runner macOS arm64 :
#   1. host-gate      : le cœur slice réellement, sur macOS (vérification rapide)
#   2. ios-engine     : dépendances + libslic3r + ABI C pour arm64-iphoneos
#   3. ios-app        : app SwiftUI, bundle vérifié, .ipa non signée, artefacts
#
# Rien ici ne nécessite de compte Apple payant : la .ipa est non signée et
# s'installe avec SideStore (docs/sideloading.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "Portée de l'exécution"
        type: choice
        options:
          - configure     # patches + configuration des dépendances (quelques minutes)
          - deps-smoke    # + quelques dépendances réellement compilées pour arm64-ios
          - engine        # + moteur arm64-ios, app et .ipa (sans la gate hôte)
          - full          # tout : gate hôte en plus (elle exécute un slicing réel)
        default: configure

# Coût : les runners macOS consomment les minutes GitHub Actions avec un
# multiplicateur ×10, et `ios-engine` construit toutes les dépendances (1–2 h).
# Trois portées, du moins cher au plus cher :
#   configure   (défaut sur push/PR) : bootstrap + configuration des dépendances
#   deps-smoke  : quelques dépendances réellement compilées pour arm64-ios
#   engine      : + moteur arm64-ios, app et .ipa (sans la gate hôte)
#   full        : tout, gate hôte comprise (elle exécute un slicing réel)
#     gh workflow run ios.yml -f scope=deps-smoke
#     gh workflow run ios.yml -f scope=full
# ou, pour que chaque push lance tout : gh variable set QSID_FULL_CI --body true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QSID_JOBS: "6"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Vérification de configuration : quelques minutes, et c'est là que se
  #    révèlent les erreurs de patches/outillage, avant les builds longs.
  # ---------------------------------------------------------------------------
  configure-check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: brew install cmake ninja

      - name: Bootstrap des sources amont
        run: scripts/bootstrap.sh

      - name: Compilateurs « machine de build »
        run: scripts/host-cc.sh build/host-tools

      - name: Configure des dépendances iOS (sans compiler)
        run: QSID_TARGET=ios scripts/build-deps.sh configure

  # ---------------------------------------------------------------------------
  # 0bis. Smoke des dépendances : quelques dépendances réellement compilées pour
  #       arm64-iphoneos (recettes CMake, autotools GMP/MPFR, z3), en quelques
  #       minutes. C'est la vérification à faire passer avant le build complet.
  # ---------------------------------------------------------------------------
  deps-smoke:
    needs: configure-check
    if: ${{ inputs.scope == 'deps-smoke' || inputs.scope == 'full' || vars.QSID_FULL_CI == 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: brew install cmake ninja

      - name: Cache des dépendances (iOS) — restauration
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps-ios
            build/dl-cache
          key: deps-ios-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap.sh', 'patches/*.patch') }}
          restore-keys: |
            deps-ios-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap.sh', 'patches/*.patch') }}-

      - name: Bootstrap des sources amont
        run: scripts/bootstrap.sh

      - name: Dépendances ciblées pour iOS (smoke)
        run: QSID_TARGET=ios scripts/build-deps.sh smoke

      - name: Cache des dépendances (iOS) — sauvegarde (même en cas d'échec)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build/deps-ios
            build/dl-cache
          key: deps-ios-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap.sh', 'patches/*.patch') }}-${{ github.run_id }}

      - name: Journal du smoke
        if: failure()
        run: |
          for log in $(find build/deps-ios -name '*-configure-*.log' -o -name '*-build-*.log' 2>/dev/null | tail -3); do
            echo "=== $log"
            tail -60 "$log"
          done
          for cfg in $(find build/deps-ios -name config.log 2>/dev/null | tail -3); do
            echo "=== $cfg (les autotools expliquent tout ici, et nulle part ailleurs)"
            tail -60 "$cfg"
          done

  # ---------------------------------------------------------------------------
  # 1. Gate hôte : compile le moteur pour macOS et slice un cube de test.
  #    Rapide à lire, et c'est le seul endroit où un binaire s'exécute.
  # ---------------------------------------------------------------------------
  host-gate:
    needs: configure-check
    # `env` n'est pas disponible dans un `if` de job : l'expression est répétée
    # telle quelle sur les trois jobs longs.
    if: ${{ inputs.scope == 'full' || vars.QSID_FULL_CI == 'true' }}
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: brew install cmake ninja xcodegen

      - name: Cache des dépendances (hôte) — restauration
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps-host
            build/dl-cache
          # La clé exacte sert au premier passage ; `restore-keys` rattrape les
          # sauvegardes faites après un échec (clé suffixée par run_id), pour que
          # chaque reprise reprenne le build au lieu de tout refaire.
          key: deps-host-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap.sh', 'patches/*.patch') }}
          restore-keys: |
            deps-host-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap.sh', 'patches/*.patch') }}-

      - name: Bootstrap des sources amont
        run: scripts/bootstrap.sh

      - name: Dépendances (hôte)
        run: QSID_TARGET=host scripts/build-deps.sh

      - name: Cœur + gate (hôte)
        run: QSID_TARGET=host scripts/build-engine.sh gate

      - name: Gate de slicing
        run: QSID_TARGET=host scripts/gate.sh

      - name: Cache des dépendances (hôte) — sauvegarde (même en cas d'échec)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build/deps-host
            build/dl-cache
          key: deps-host-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap.sh', 'patches/*.patch') }}-${{ github.run_id }}

      - name: Journal du G-code produit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-gcode-host
          path: build/gate-out/*.gcode
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2. Moteur iOS : dépendances + libslic3r + ABI C pour arm64-iphoneos.
  # ---------------------------------------------------------------------------
  ios-engine:
    needs: configure-check
    if: ${{ inputs.scope == 'full' || inputs.scope == 'engine' || vars.QSID_FULL_CI == 'true' }}
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: brew install cmake ninja

      - name: Cache des dépendances (iOS) — restauration
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps-ios
            build/dl-cache
          key: deps-ios-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap.sh', 'patches/*.patch') }}
          restore-keys: |
            deps-ios-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap.sh', 'patches/*.patch') }}-

      - name: Bootstrap des sources amont
        run: scripts/bootstrap.sh

      - name: Dépendances (iOS arm64)
        run: QSID_TARGET=ios scripts/build-deps.sh

      - name: Cœur (iOS arm64)
        run: QSID_TARGET=ios scripts/build-engine.sh

      - name: Archive fusionnée + en-têtes
        run: QSID_TARGET=ios scripts/package-engine.sh

      - name: Vérification de l'archive (arm64, iOS, moteur présent)
        run: |
          set -e
          ARCHS=$(lipo -archs build/dist-ios/lib/QSlicerEngine.a)
          echo "archs = $ARCHS"
          [ "$ARCHS" = "arm64" ]
          # Le moteur doit vraiment être dedans : on cherche des symboles de libslic3r.
          nm -arch arm64 build/dist-ios/lib/QSlicerEngine.a 2>/dev/null | grep -q "CLI.*run" \
            || { echo "les symboles de Slic3r::CLI sont absents de l'archive"; exit 1; }

      - name: Vérification des symboles de l'ABI C
        run: nm -arch arm64 build/dist-ios/lib/QSlicerEngine.a | grep -E "_qsid_(create|slice|destroy|version)" | sort -u

      - name: Dans quel SDK les objets ont-ils été construits ?
        run: |
          obj=$(find build/engine-ios -name 'qidislice.cpp.o' | head -1)
          [ -n "$obj" ] || { echo "objet qidislice introuvable"; exit 1; }
          vtool -show-build "$obj" | sed 's/^/    /'

      - name: Cache des dépendances (iOS) — sauvegarde (même en cas d'échec)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build/deps-ios
            build/dl-cache
          key: deps-ios-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap.sh', 'patches/*.patch') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: engine-ios-arm64
          path: |
            build/dist-ios/lib/QSlicerEngine.a
            build/dist-ios/include/qidislice.h
            build/dist-ios/QSlicerEngine-link.txt

  # ---------------------------------------------------------------------------
  # 3. App : projet XcodeGen, build iOS, contrôles du bundle, .ipa non signée.
  # ---------------------------------------------------------------------------
  ios-app:
    needs: ios-engine
    if: ${{ inputs.scope == 'full' || inputs.scope == 'engine' || vars.QSID_FULL_CI == 'true' }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: brew install xcodegen

      - name: Sources amont (profils vendor à embarquer)
        run: scripts/bootstrap.sh

      - name: Récupérer le moteur compilé
        uses: actions/download-artifact@v4
        with:
          name: engine-ios-arm64
          path: build/dist-ios

      - name: Ressources du bundle (profils QIDI)
        run: scripts/stage-resources.sh

      - name: Générer le projet Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Construire l'app (Release, sans signature)
        run: |
          # pipefail : sinon l'échec de xcodebuild est masqué par le pipe vers tee/tail
          set -euo pipefail
          xcodebuild \
            -project ios/QSlicerPad.xcodeproj \
            -scheme QSlicerPad \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/xcode-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            QSID_ENGINE_ARCHIVE="$PWD/build/dist-ios" \
            QSID_ENGINE_LINK_FLAGS="$(grep -v '^#' build/dist-ios/QSlicerEngine-link.txt | tr '\n' ' ')" \
            build | tee xcodebuild.log | tail -40

      - name: Contrôles du bundle
        run: |
          set -euo pipefail
          app=build/xcode-ios/Build/Products/Release-iphoneos/QSlicerPad.app
          test -d "$app"
          test -x "$app/QSlicerPad"
          archs=$(lipo -archs "$app/QSlicerPad")
          echo "architecture : $archs"
          [ "$archs" = "arm64" ]
          vtool -show-build "$app/QSlicerPad" | sed 's/^/    /'
          # Le moteur est réellement dans le binaire : chaîne de version de l'amont.
          strings "$app/QSlicerPad" | grep -q "QIDISlicer-"
          # Profils vendor embarqués (XcodeGen les copie à la racine du bundle).
          test -f "$app/qidi/profiles/QIDITechnology.ini"
          ls "$app/qidi/profiles" | head -5
          du -sh "$app"

      - name: Paqueter la .ipa non signée
        run: |
          set -e
          app=build/xcode-ios/Build/Products/Release-iphoneos/QSlicerPad.app
          rm -rf build/ipa-ios && mkdir -p build/ipa-ios/Payload
          cp -R "$app" build/ipa-ios/Payload/
          (cd build/ipa-ios && zip -qry "$GITHUB_WORKSPACE/QSlicerPad-unsigned.ipa" Payload)
          ls -lh QSlicerPad-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: QSlicerPad-unsigned-ipa
          path: QSlicerPad-unsigned.ipa

      - name: Journal xcodebuild (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
